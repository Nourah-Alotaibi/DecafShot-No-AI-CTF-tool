name: Portable tests
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s 1_classifier/tests -v
      - run: python -m unittest discover -s 2_tool_catalog/tests -v
      - run: python -m unittest discover -s 3_flag_hunter/tests -v
